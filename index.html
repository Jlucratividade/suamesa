<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ares Atlântico — Mapa de Mesas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Ares Atlântico — Mapa de Mesas</h1>
    
    <div class="legenda">
        <span><i class="dot livre"></i> Livre</span>
        <span><i class="dot reservada"></i> Reservada (hold)</span>
        <span><i class="dot paga"></i> Vendida</span>
        <span><i class="dot selecionada"></i> Selecionada por você</span>
    </div>

    <div class="acoes-superiores" style="margin-bottom: 15px; display: flex; gap: 10px;">
        <button id="btnAtualizarMapa" class="btn-secundario">
            🔄 Atualizar Mapa
        </button>
        <button id="btnToggleMapa" class="btn-secundario">
            Ocultar mapa impresso
        </button>
    </div>

    <div id="mapaImagemWrapper">
        <div id="mapaImagemContainer">
            <!-- Indicador de loading -->
            <div id="loadingImagem" class="loading-overlay">
                <div class="loading-spinner"></div>
                <span>Processando imagem...</span>
            </div>
            
            <img 
                id="mapaImagem"
                src=""
                alt="Mapa das mesas"
                style="display: none;">
        </div>
    </div>

    <div id="mapa"></div>

    <div id="painel">
        <div id="resumo-selecao">
            Nenhuma mesa selecionada.
        </div>
        
        <input
  id="nome"
  name="nome"
  type="text"
  minlength="5"
  maxlength="60"
  autocomplete="name"
  placeholder="Seu nome completo"
  pattern="[A-Za-zÀ-ÿ]+(\s+[A-Za-zÀ-ÿ]+)+"
  oninput="this.value=this.value.replace(/[^A-Za-zÀ-ÿ\s]/g,'')"
  required>

<input
  id="contato"
  name="contato"
  type="tel"
  inputmode="numeric"
  pattern="[0-9]{11}"
  minlength="11"
  maxlength="11"
  placeholder="11999998888"
  oninput="this.value=this.value.replace(/\D/g,'')"
  required>

        <button id="btnReservar" disabled>
            Selecione ao menos 1 mesa
        </button>
        
        <button id="btnPagar" class="btn-pagar oculto">
            Pagar com Pix ou Cartão
        </button>
        
        <div id="status-msg"></div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
